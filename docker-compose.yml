services:
  argus:
    # Argus 的发布工作流会把版本镜像发布到本项目的 GitHub Container Registry。
    image: ghcr.io/shuhunb515/argus:${ARGUS_TAG:-latest}
    environment:
      ARGUS_AUTH_MODE: ${ARGUS_AUTH_MODE:-disabled}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGUS_LLM_PROVIDER: ${ARGUS_LLM_PROVIDER:-}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:-}
      ARGUS_LLM_PROXY: ${ARGUS_LLM_PROXY:-}
      # 本机模式不要求登录；开启 required 身份验证时可使用以下高级选项。
      ARGUS_SETUP_TOKEN: ${ARGUS_SETUP_TOKEN:-}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      # 浏览器跨域白名单（逗号分隔）。内置 UI 使用同源请求，通常留空。
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-}
      # 服务器端默认输出语言只支持 zh 和 en；默认使用简体中文。
      ARGUS_LANG: ${ARGUS_LANG:-zh}
    ports:
      # 默认只监听主机 127.0.0.1。若确需其他设备访问，可在 .env 设置
      # ARGUS_BIND=0.0.0.0；请先完成管理员密码设置，并按 README 配置 HTTPS 反向代理。
      - "${ARGUS_BIND:-127.0.0.1}:${ARGUS_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 镜像已配置普通用户及目录权限，不需要用户自行创建账号或修改权限。
      - argus-data:/data
    restart: unless-stopped

volumes:
  argus-data:
