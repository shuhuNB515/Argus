services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 在文件中 POSTGRES_PASSWORD 请设定}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 本地源码运行的 Go 后端通过该端口连接数据库。仅监听回环地址，
      # 不会把 PostgreSQL 暴露给局域网。
      - "127.0.0.1:${ARGUS_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  argus:
    # Argus 的发布工作流会把版本镜像发布到本项目的 GitHub Container Registry。
    image: ghcr.io/shuhunb515/argus:${ARGUS_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARGUS_PG_DSN: postgres://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argus}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGUS_LLM_PROVIDER: ${ARGUS_LLM_PROVIDER:-}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:-}
      ARGUS_LLM_PROXY: ${ARGUS_LLM_PROXY:-}
      # 首次运行保护：留空时会在启动日志中生成一次性设置令牌。
      # 打开 /setup 并输入令牌后创建管理员密码；也可直接设置 ARGUS_ADMIN_PASSWORD。
      ARGUS_SETUP_TOKEN: ${ARGUS_SETUP_TOKEN:-}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      # 浏览器跨域白名单（逗号分隔）。内置 UI 使用同源请求，通常留空。
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-}
      # 服务器端默认输出语言只支持 zh 和 en；默认使用简体中文。
      ARGUS_LANG: ${ARGUS_LANG:-zh}
    ports:
      # 默认只监听主机 127.0.0.1。若确需其他设备访问，可在 .env 设置
      # ARGUS_BIND=0.0.0.0；请先完成管理员密码设置，并按 README 配置 HTTPS 反向代理。
      - "${ARGUS_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 数据目录（包括 jwt.key 和 SQLite 数据）绑定到项目根目录的 data/。
      # 容器重建后数据仍会保留，方便从主机检查和备份。
      - ./data:/app/data
      # 项目根目录的 skills 会挂载到容器中，覆盖镜像内的 /app/skills。
      # 修改技能后不必重建镜像，容器会直接读取主机文件。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
