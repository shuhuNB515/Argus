name: 💡 功能建议
description: 提议新的功能或改进。
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先描述要解决的问题，再描述希望的实现方式。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过，没有找到相同建议。
          required: true
        - label: 该建议不会鼓励超出授权范围或法律允许范围的使用。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
    validations:
      required: false
