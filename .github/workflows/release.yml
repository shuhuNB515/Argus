name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Required to create the release.

jobs:
  # ① Export the frontend once and reuse it for every platform build.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Linux/Windows cross compilation. macOS packages are built on macOS below
  # so the release can include a real DMG.
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARGUS_TARGET_OS: ${{ matrix.goos }}
          ARGUS_TARGET_ARCH: ${{ matrix.goarch }}
          ARGUS_BUILD_VERSION: ${{ github.ref_name }}
          ARGUS_SKIP_FRONTEND: "1"
          ARGUS_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF files can fail on some Linux kernels and sandboxes.
          # Releases use Go linker stripping and archive compression for portability.
          ARGUS_COMPRESS: "0"
          ARGUS_PACKAGE: "1"
          ARGUS_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARGUS_TARGET_OS}/${ARGUS_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/argus-linux-amd64/argus -h
      - uses: docker/setup-qemu-action@v3
        if: matrix.goos == 'linux'
      - name: Test original Linux launcher offline with read-only installation
        if: matrix.goos == 'linux'
        run: |
          archive=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$archive" -d dist/launcher-test
          root=$(find dist/launcher-test -mindepth 1 -maxdepth 1 -type d -print -quit)
          docker build --platform "linux/${{ matrix.goarch }}" -f packaging/tests/Dockerfile.launcher --build-arg RELEASE_DIR="$root" -t argus-launcher-test .
          docker run --rm --network none --platform "linux/${{ matrix.goarch }}" argus-launcher-test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos == 'windows' && 'raw-windows-amd64' || format('pkg-{0}-{1}', matrix.goos, matrix.goarch) }}
          path: "dist/*.zip"
      # Upload Linux binaries separately so the container job can reuse them.
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/argus-linux-${{ matrix.goarch }}/argus

  macos-packages:
    needs: frontend
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build Argus macOS app and DMG
        env:
          ARGUS_TARGET_OS: ${{ matrix.goos }}
          ARGUS_TARGET_ARCH: ${{ matrix.goarch }}
          ARGUS_BUILD_VERSION: ${{ github.ref_name }}
          ARGUS_SKIP_FRONTEND: "1"
          ARGUS_SKIP_NPM_CI: "1"
          ARGUS_COMPRESS: "0"
          ARGUS_PACKAGE: "1"
          ARGUS_PACKAGE_DIR: dist
        run: ./build.sh --target "${ARGUS_TARGET_OS}/${ARGUS_TARGET_ARCH}"
      - name: Test original macOS app launcher
        if: matrix.goarch == 'arm64'
        run: |
          archive=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$archive" -d dist/launcher-test
          app=$(find dist/launcher-test -name Argus.app -type d -print -quit)
          export HOME="$(mktemp -d)"
          python3 scripts/smoke-release.py "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.dmg

  windows-installer:
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-windows-amd64
          path: downloaded
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build Argus Windows installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem downloaded -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath stage
          $root = Get-ChildItem stage -Directory | Select-Object -First 1
          ./packaging/windows/bundle-database.ps1 -PackageRoot $root.FullName
          $env:ARGUS_POSTGRES_CACHE = Join-Path $root.FullName 'database-cache'
          go test ./config ./db -run '^TestWindows(UserConfigPath|OfflineEmbeddedDatabase)$' -count=1 -v -timeout 180s
          if ($LASTEXITCODE -ne 0) { throw 'Offline database restart test failed' }
          Copy-Item packaging/windows/Argus.nsi $root.FullName
          Copy-Item packaging/windows/create-shortcuts.ps1 $root.FullName
          Copy-Item packaging/windows/ArgusShortcuts.cs $root.FullName
          Push-Location $root.FullName
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" Argus.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          Pop-Location
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$root\argus-*-windows-amd64-setup.exe" dist/
          Remove-Item (Join-Path $root.FullName 'Argus.nsi')
          Get-ChildItem $root.FullName -Filter '*-setup.exe' | Remove-Item
          Compress-Archive -Path $root.FullName -DestinationPath (Join-Path 'dist' $zip.Name)
          $installer = (Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1).FullName
          ./packaging/windows/smoke-install.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-amd64
          path: |
            dist/*.exe
            dist/*.zip

  # ③ Collect packages and create the GitHub release.
  release:
    needs: [binaries, macos-packages, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip *.dmg *.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS
          generate_release_notes: true

  # ④ Build and publish multi-architecture images to GitHub Container Registry.
  docker:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/shuhunb515/argus
    steps:
      - uses: actions/checkout@v4 # Fetch the Dockerfile and skills.
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image defaults without network or application settings
        run: |
          docker pull "${IMAGE_NAMESPACE}:${GITHUB_REF_NAME}"
          python3 scripts/smoke-container.py "${IMAGE_NAMESPACE}:${GITHUB_REF_NAME}"
