title: ARGUS Platform Guard Audit-Log Framing
id: 3add497e-36cb-47c4-8993-df8f98585ef7
status: experimental
description: |
    Detects the control-framing string the ARGUS platform guard writes to its audit log when it
    blocks a tool call. Blocked calls are recorded with a message beginning with the literal
    marker shown below (ARGUS platform control, non-target defence). Finding this marker in a
    host's application or audit logs strongly supports that ARGUS ran on that host. This is a
    host and forensic indicator, not a target-side signal.
references:
    - https://github.com/shuhuNB515/Argus/blob/main/docs/defense-en.md
    - https://github.com/shuhuNB515/Argus/blob/main/docs/defense-en.md
    - https://github.com/shuhuNB515/Argus
author: Argus defense guide
date: 2026-10-05
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: application
detection:
    keywords:
        - '【ARGUS 平台管控·非目标防御】'
    condition: keywords
falsepositives:
    - Logs that quote this defense guide or the ARGUS source code for documentation purposes.
level: high
